<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Xcelerate 2K26 QR Scanner</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 500px;
      background: white;
      border-radius: 18px;
      padding: 25px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.12);
      text-align: center;
    }

    h1 {
      margin-top: 0;
      color: #111827;
    }

    .subtitle {
      color: #6b7280;
      margin-bottom: 20px;
    }

    #reader {
      width: 100%;
      margin: auto;
    }

    .status {
      margin-top: 20px;
      padding: 14px;
      border-radius: 10px;
      background: #f3f4f6;
      color: #374151;
      font-size: 14px;
    }

    .success {
      background: #dcfce7;
      color: #166534;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
    }

    button {
      margin-top: 15px;
      padding: 12px 22px;
      border: none;
      border-radius: 10px;
      background: #111827;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>Xcelerate 2K26</h1>

  <div class="subtitle">
    Volunteer QR Scanner
  </div>

  <div id="reader"></div>

  <div id="status" class="status">
    Opening camera...
  </div>

  <button id="startButton" onclick="startScanner()" style="display:none;">
    START CAMERA
  </button>

</div>

<script>

let scanner = null;
let scanned = false;

function setStatus(message, type = "") {

  const status = document.getElementById("status");

  status.innerText = message;

  status.className = "status";

  if (type) {
    status.classList.add(type);
  }
}


function extractToken(decodedText) {

  try {

    const url = new URL(decodedText);

    const token = url.searchParams.get("token");

    if (token) {
      return token;
    }

  } catch (error) {

    // QR may contain plain token

  }

  return null;
}


function sendTokenToVolunteer(token) {

  if (!window.opener) {

    setStatus(
      "This scanner was not opened from the Volunteer page. Please close this tab and open the scanner using the Volunteer page.",
      "error"
    );

    return;
  }

  window.opener.postMessage(
    {
      type: "XCELERATE_QR",
      token: token
    },
    "*"
  );

  setStatus(
    "QR scanned successfully. Returning to Volunteer page...",
    "success"
  );

  setTimeout(function() {

    try {
      window.close();
    } catch (e) {}

  }, 800);
}


function onScanSuccess(decodedText, decodedResult) {

  if (scanned) {
    return;
  }

  scanned = true;

  if (scanner) {

    try {
      scanner.pause(true);
    } catch (e) {}

  }

  const token = extractToken(decodedText);

  if (!token) {

    scanned = false;

    setStatus(
      "Invalid Xcelerate QR. Please scan the participant QR again.",
      "error"
    );

    if (scanner) {

      try {
        scanner.resume();
      } catch (e) {}

    }

    return;
  }

  sendTokenToVolunteer(token);
}


function onScanFailure(error) {

  // Ignore continuous scanner errors.
}


function startScanner() {

  document.getElementById("startButton").style.display = "none";

  setStatus("Requesting camera permission...");

  scanner = new Html5Qrcode("reader");

  const config = {
    fps: 10,
    qrbox: {
      width: 250,
      height: 250
    }
  };

  scanner.start(
    {
      facingMode: "environment"
    },
    config,
    onScanSuccess,
    onScanFailure
  )
  .then(function() {

    setStatus("Camera ready. Point the camera at the participant QR.");

  })
  .catch(function(error) {

    console.error(error);

    setStatus(
      "Camera could not be opened. Please allow camera permission and try again.",
      "error"
    );

    document.getElementById("startButton").style.display = "inline-block";

  });

}


// Try automatically when page opens.

window.addEventListener("load", function() {

  setTimeout(function() {
    startScanner();
  }, 500);

});

</script>

</body>
</html>
